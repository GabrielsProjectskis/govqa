services:
  api:
    build: .
    image: govqa:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Full index built on the host (python -m govqa.index). Without it the API serves the sample.
      - ./data:/app/data
      - hf-cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ui:
    image: govqa:latest
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    environment:
      GOVQA_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  hf-cache:
